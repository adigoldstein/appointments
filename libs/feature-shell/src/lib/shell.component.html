<mat-sidenav-container class="shell">
  <mat-sidenav
    class="shell__nav"
    [mode]="isDesktop() ? 'side' : 'over'"
    [opened]="isDesktop() || sidenavOpen()"
    (closed)="sidenavOpen.set(false)"
  >
    <div class="shell__nav-user">
      <span class="shell__nav-user-name">{{ navigation.userDisplayName() }}</span>
      <span class="shell__nav-user-role">{{ navigation.roleLabel() }}</span>
    </div>

    <nav class="shell__nav-list" aria-label="ניווט ראשי">
      @for (navSection of navigation.sections(); track $index) {
        @if (navSection.title) {
          <span class="shell__nav-section-title">{{ navSection.title }}</span>
        }
        @for (item of navSection.items; track item.path) {
          <a
            class="shell__nav-link"
            [routerLink]="item.path"
            routerLinkActive="shell__nav-link--active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="onNavLinkClick()"
          >
            {{ item.label }}
          </a>
        }
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <ui-header
      brand="Schedula"
      [showMenuToggle]="!isDesktop()"
      menuToggleLabel="פתיחת תפריט ניווט"
      (menuToggle)="toggleNav()"
    >
      <ui-button variant="ghost" size="sm" (click)="onLogout()">התנתקות</ui-button>
    </ui-header>

    <app-context-bar />

    <main class="shell__main">
      <!-- One-item @for keyed on the target: switching Provider/Client re-creates the page (ADR-0005). -->
      @for (key of [pageKey()]; track key) {
        <router-outlet />
      }
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
